<!-- PROTOTYPE — throwaway. Variant D: Day timeline.
     Intent: the Daily Note is the day itself; time-stamped entries, meetings and Todo moments sit on an elastic 07:00–22:00 timeline, with structured panels alongside. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commander · Daily Note · D Day timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1218; --bg-2:#10161e; --panel:#141b24; --panel-2:#19212c; --raise:#212b38;
  --line:#212b37; --line-2:#2c3746;
  --text:#e6eaf0; --text-2:#a6b0bd; --text-3:#6e7988; --text-4:#5a6577;
  --meet:#5ea2ff; --meet-ink:#a9cdff;
  --note:#3ccfa5; --note-ink:#8ae6ca;
  --linear:#8f8bff; --linear-ink:#c4c2ff;
  --agent:#ffb648; --agent-ink:#ffd18a;
  --now:#ff6b5b;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 14px/1.5 var(--sans);font-feature-settings:"tnum" 1,"zero" 0;-webkit-font-smoothing:antialiased;overflow:hidden;display:grid;grid-template-rows:48px auto minmax(0,1fr)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:none}
::selection{background:rgba(60,207,165,.3)}
svg{display:block;flex:none}

/* ───────── top bar ───────── */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg-2)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px;letter-spacing:.01em}
.brand .mark{width:20px;height:20px;border-radius:6px;background:conic-gradient(from 220deg,var(--note),var(--meet),var(--linear),var(--agent),var(--note));display:grid;place-items:center}
.brand .mark::after{content:"";width:8px;height:8px;border-radius:2.5px;background:var(--bg-2)}
.seg{display:flex;gap:2px;padding:3px;background:#0a0e13;border:1px solid var(--line);border-radius:10px}
.seg button{padding:4px 13px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--text-3);transition:color .15s,background .15s}
.seg button:hover{color:var(--text-2);background:rgba(255,255,255,.03)}
.seg button.on{color:var(--text);background:var(--raise);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 3px rgba(0,0,0,.5)}
.tb-right{justify-self:end;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--text-3)}
.clock{font-family:var(--mono);font-size:11.5px}
.clock b{color:var(--text-2);font-weight:500}
.agent-pill{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 9px;border:1px solid var(--line);border-radius:99px;font-size:11.5px}
.agent-pill i{width:6px;height:6px;border-radius:50%;background:var(--agent);box-shadow:0 0 0 3px rgba(255,182,72,.14)}

/* ───────── date header ───────── */
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:32px;padding:14px 32px 14px 24px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--bg-2),var(--bg))}
.dh-left{display:flex;align-items:center;gap:22px;min-width:0}
.navbtns{display:flex;gap:6px}
.navbtns button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--text-2);background:var(--panel);transition:all .15s}
.navbtns button:hover:not(:disabled){color:var(--text);border-color:#3b4858;background:var(--panel-2)}
.navbtns button:disabled{opacity:.3;cursor:default}
.navbtns svg{width:16px;height:16px}
.over{font:500 10.5px/16px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);display:flex;gap:9px;align-items:center}
.over .sep{color:var(--text-4)}
.today-chip{color:var(--now);display:inline-flex;gap:6px;align-items:center}
.today-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--now)}
.backtoday{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--note-ink);padding:0 6px;border-radius:4px;border:1px solid rgba(60,207,165,.3)}
.backtoday:hover{background:rgba(60,207,165,.1)}
.dtitle{font-size:29px;line-height:1.2;font-weight:600;letter-spacing:-.022em;margin:5px 0 8px;white-space:nowrap}
.dtitle span{font-weight:300;color:var(--text-2);letter-spacing:-.015em}
.stats{display:flex;gap:18px;font-size:12.5px;color:var(--text-3);white-space:nowrap}
.stats span{display:inline-flex;align-items:center}
.stats b{color:var(--text);font-weight:500;font-family:var(--mono);font-size:12px;margin-right:5px}
.stats i{width:8px;height:8px;border-radius:2px;margin-right:8px}
.stats .zero{opacity:.55}
.heat{display:flex;gap:18px;align-items:flex-end;flex:none}
.heat-cap{text-align:right;padding-bottom:1px}
.heat-cap h4{font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:.01em}
.heat-cap p{font-size:11.5px;color:var(--text-3);margin-top:1px}
.heat-cap p b{font-family:var(--mono);font-weight:500;color:var(--text-2)}
.legend{display:flex;gap:3px;align-items:center;justify-content:flex-end;font-size:10.5px;color:var(--text-4);margin-top:9px}
.legend .c{width:9px;height:9px;border-radius:2px}
.legend span{margin:0 3px}
.hm{display:grid;grid-template-columns:20px repeat(12,10px);grid-template-rows:11px repeat(7,10px);gap:3px}
.hm .mo{font:500 9.5px/11px var(--mono);color:var(--text-3);white-space:nowrap}
.hm .dl{font:500 9px/10px var(--mono);color:var(--text-4)}
.c{width:10px;height:10px;border-radius:2.5px;background:#18212b}
.c.l1{background:#123a30}.c.l2{background:#165b47}.c.l3{background:#1f8b69}.c.l4{background:#3ccfa5}
.hm .c.future{background:transparent;box-shadow:inset 0 0 0 1px #1d2631}
.hm .c.has{cursor:pointer}
.hm .c.has:hover{outline:1px solid var(--text-2);outline-offset:1px}
.hm .c.sel{outline:1.5px solid var(--text);outline-offset:1.5px}

/* ───────── main grid ───────── */
.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
.tlwrap{overflow-y:auto;overflow-x:hidden;position:relative;padding:0 0 150px;scrollbar-width:thin;scrollbar-color:#2a3442 transparent}
.tlwrap::before{content:"";display:block;position:sticky;top:0;height:18px;margin-bottom:-18px;background:linear-gradient(var(--bg),rgba(13,18,24,0));z-index:9;pointer-events:none}
.side{overflow-y:auto;border-left:1px solid var(--line);background:linear-gradient(180deg,#0f151c,var(--bg) 40%);padding:12px 18px 12px;scrollbar-width:thin;scrollbar-color:#2a3442 transparent}

/* ───────── timeline ───────── */
.lane{position:relative;margin:0 36px 0 12px;max-width:1120px;min-height:400px}
.lane.swap{animation:swap .32s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hline{position:absolute;left:70px;right:0;height:1px;background:rgba(255,255,255,.042)}
.htick{position:absolute;left:80px;width:9px;height:1px;background:rgba(255,255,255,.13)}
.hlabel{position:absolute;left:14px;width:48px;text-align:right;font:500 11px/16px var(--mono);color:var(--text-3)}
.hlabel.future{color:var(--text-4)}
.hlabel.hide{opacity:0}
.axis{position:absolute;left:84px;width:1px}
.axis.past{background:linear-gradient(180deg,rgba(60,207,165,.08),rgba(60,207,165,.5))}
.axis.fut{background:repeating-linear-gradient(180deg,#334050 0 3px,transparent 3px 7px)}
.now{position:absolute;left:68px;right:0;height:0;border-top:1.5px solid var(--now);z-index:5;pointer-events:none;box-shadow:0 0 12px 0 rgba(255,107,91,.55)}
.now::after{content:"NOW";position:absolute;right:0;top:-17px;font:600 9.5px/1 var(--mono);letter-spacing:.12em;color:var(--now)}
.nowchip{position:absolute;left:12px;transform:translateY(-50%);font:600 11px/1 var(--mono);color:#200c09;background:var(--now);padding:4px 6px;border-radius:5px;z-index:6;pointer-events:none}
.ghost{position:absolute;left:68px;right:0;height:0;border-top:1px dashed rgba(60,207,165,.65);pointer-events:none;opacity:0;transition:opacity .12s;z-index:4}
.ghost.on{opacity:1}
.ghost span{position:absolute;left:30px;top:-11px;font:500 11px/20px var(--mono);color:#061a14;background:var(--note);padding:0 8px;border-radius:5px;white-space:nowrap}
.lane.can-add{cursor:copy}

.item{position:absolute;left:108px;right:0;transition:top .34s var(--ease),height .34s var(--ease)}
.no-anim .item,.no-anim .hline,.no-anim .htick,.no-anim .hlabel,.no-anim .axis,.no-anim .now,.no-anim .nowchip{transition:none!important}
.hline,.htick,.hlabel,.axis,.now,.nowchip{transition:top .34s var(--ease),height .34s var(--ease),opacity .2s}

/* entries */
.entry{background:var(--bg);padding:0 0 2px}
.entry .dot{position:absolute;left:-29px;top:4px;width:10px;height:10px;border-radius:50%;border:2px solid var(--note);background:var(--bg)}
.entry.idea .dot{background:var(--note);box-shadow:0 0 0 3px rgba(60,207,165,.14)}
.meta{display:flex;align-items:center;gap:10px;height:18px}
.time{font:500 12px/18px var(--mono);color:var(--note-ink);padding:0 4px;margin-left:-4px;border-radius:4px;transition:background .15s}
.time:hover{background:rgba(60,207,165,.14)}
.time-in{font:500 12px/18px var(--mono);color:var(--text);background:var(--panel-2);width:54px;padding:0 5px;margin-left:-4px;border-radius:4px;box-shadow:0 0 0 1px rgba(60,207,165,.55)}
.kind{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.kind svg{width:12px;height:12px;color:var(--note)}
.acts{display:flex;gap:2px;opacity:0;transition:opacity .15s;margin-left:2px}
.entry:hover .acts,.entry:focus-within .acts{opacity:1}
.acts button{font-size:11.5px;color:var(--text-3);padding:0 7px;line-height:18px;border-radius:5px}
.acts button:hover{color:var(--text);background:rgba(255,255,255,.06)}
.body{margin:3px 0 0 -10px;padding:3px 10px 4px;border-radius:7px;max-width:72ch;font-size:15px;line-height:1.62;color:#dbe1e9;white-space:pre-wrap;word-wrap:break-word;cursor:text;transition:background .15s,box-shadow .15s;outline:none}
.body:hover{background:rgba(255,255,255,.035)}
.body.editing,.ntext.editing,.ttext.editing{background:var(--panel-2);box-shadow:0 0 0 1px rgba(60,207,165,.5),0 0 0 4px rgba(60,207,165,.08)}
.body:empty::before{content:attr(data-ph);color:var(--text-4)}
.entry.lg .body{font-size:16px;line-height:1.66;color:var(--text)}
.wl{color:var(--note-ink);text-decoration:none;cursor:pointer;border-radius:3px;background:rgba(60,207,165,.09);box-shadow:inset 0 -1px 0 rgba(60,207,165,.45);padding:0 2px;transition:background .15s}
.wl:hover{background:rgba(60,207,165,.2)}
.lead{font-weight:600;color:#fff}

/* todo moments on the timeline */
.mark{height:22px;display:flex;align-items:center;background:var(--bg)}
.mdot{position:absolute;left:-32px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--note);color:#06150f;display:grid;place-items:center}
.mdot svg{width:10px;height:10px}
.mark.lin .mdot{background:var(--linear);color:#13112b}
.mark.added .mdot{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--note);color:var(--note)}
.mark.added.agent .mdot{box-shadow:inset 0 0 0 1.5px var(--agent);color:var(--agent)}
.mline{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;min-width:0}
.mline .time{color:var(--text-3);padding:0;margin:0}
.mk{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.mark.lin .mk{color:var(--linear-ink)}
.mtext{overflow:hidden;text-overflow:ellipsis}
.lid{font:500 11.5px var(--mono);color:var(--linear-ink);margin-right:7px}
.via{display:inline-flex;align-items:center;gap:4px;color:var(--agent-ink);font-size:11.5px}
.via svg{width:11px;height:11px}

/* meetings */
.mtg{left:82px;max-width:1038px;border-radius:4px 10px 10px 4px;overflow:hidden;background:linear-gradient(90deg,rgba(94,162,255,.17),rgba(94,162,255,.075) 55%,rgba(94,162,255,.05));border:1px solid rgba(94,162,255,.24);border-left:0;box-shadow:inset 4px 0 0 var(--meet);z-index:1}
.mtg.past{background:linear-gradient(90deg,rgba(94,162,255,.11),rgba(94,162,255,.04));border-color:rgba(94,162,255,.16);box-shadow:inset 4px 0 0 rgba(94,162,255,.6)}
.mtg.past .mtg-title{color:#c9d6e8}
.mtg-in{padding:9px 14px 9px 26px}
.mtg-head{display:flex;align-items:center;gap:12px;min-height:26px;cursor:pointer;user-select:none}
.mtg-head svg.cal{width:14px;height:14px;color:var(--meet)}
.mtg-time{font:500 12px var(--mono);color:var(--meet-ink);white-space:nowrap}
.mtg-time i{opacity:.45;font-style:normal;margin:0 1px}
.mtg-title{font-size:14.5px;font-weight:600;color:#eef3fb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mtg-dur{font-size:11.5px;color:rgba(169,205,255,.5);white-space:nowrap}
.sp{flex:1}
.mtg-rel{font:500 11px var(--mono);color:var(--meet-ink);white-space:nowrap}
.mtg-rel.past{color:rgba(169,205,255,.45)}
.mtg-count{font-size:11.5px;font-weight:500;padding:1px 9px;border-radius:99px;background:rgba(94,162,255,.17);color:var(--meet-ink);white-space:nowrap}
.mtg-count.none{background:transparent;color:rgba(169,205,255,.55);box-shadow:inset 0 0 0 1px rgba(94,162,255,.3)}
.chev{display:grid;color:var(--meet-ink);transition:transform .25s var(--ease)}
.chev svg{width:14px;height:14px}
.mtg.open .chev{transform:rotate(180deg)}
.mtg-head:hover .mtg-title{color:#fff}
.mtg-prev{font-size:13px;color:rgba(214,228,248,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1px 0 1px 26px;cursor:pointer}
.mtg .mtg-notes{margin-left:10px}
.mtg .mtg-add{margin-left:3px}
.mtg-prev b{color:rgba(169,205,255,.75);font-weight:500;margin-right:6px}
.mtg-notes,.mtg-add{display:none}
.mtg.open .mtg-prev{display:none}
.mtg.open .mtg-notes{display:block}
.mtg.open .mtg-add{display:flex}
.mtg-notes{list-style:none;margin:9px 0 0;padding:9px 0 0;border-top:1px solid rgba(94,162,255,.18)}
.note{display:flex;align-items:flex-start;gap:8px;position:relative;padding-left:16px;margin:0 0 3px}
.note::before{content:"";position:absolute;left:4px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--meet)}
.ntext{flex:0 1 auto;min-width:0;font-size:14px;line-height:1.55;color:#dce6f4;padding:1px 6px;margin-left:-6px;border-radius:5px;cursor:text;white-space:pre-wrap;outline:none;max-width:78ch}
.ntext:hover{background:rgba(255,255,255,.04)}
.ntext:empty::before{content:"Note…";color:rgba(169,205,255,.4)}
.nagent{flex:none;display:inline-flex;gap:5px;align-items:center;font-size:11px;font-weight:500;color:var(--agent-ink);background:rgba(255,182,72,.08);box-shadow:inset 0 0 0 1px rgba(255,182,72,.4);padding:0 9px;border-radius:99px;height:21px;margin-top:1px}
.nagent svg{width:11px;height:11px}
button.nagent:hover{background:rgba(255,182,72,.16)}
.nagent.ok{color:var(--note-ink);background:rgba(60,207,165,.08);box-shadow:inset 0 0 0 1px rgba(60,207,165,.35)}
.mtg-add{align-items:center;gap:9px;margin:4px 0 1px;padding-left:1px}
.mtg-add .plus{color:var(--meet);font:500 15px/1 var(--mono);width:14px;text-align:center}
.mtg-add input{flex:1;font-size:13.5px;line-height:24px;color:var(--text)}
.mtg-add input::placeholder{color:rgba(169,205,255,.42)}

/* composer */
.composer .cdot{position:absolute;left:-31px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--now);box-shadow:0 0 0 4px rgba(255,107,91,.16)}
.composer,.prompt-item{max-width:none}
.cbox{background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:9px 12px 8px 14px;box-shadow:0 14px 32px -14px rgba(0,0,0,.7);transition:border-color .15s,box-shadow .15s}
.cbox:focus-within{border-color:rgba(255,107,91,.5);box-shadow:0 0 0 4px rgba(255,107,91,.07),0 14px 32px -14px rgba(0,0,0,.7)}
.crow{display:flex;gap:12px;align-items:flex-start}
.ctime{font:600 12px/24px var(--mono);color:var(--now);flex:none}
.crow textarea{flex:1;resize:none;font-size:15px;line-height:24px;height:24px;max-height:168px;color:var(--text);overflow-y:auto}
.crow textarea::placeholder{color:var(--text-4)}
.cfoot{display:flex;align-items:center;gap:12px;margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
.ckinds{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px}
.ckinds button{font-size:11.5px;font-weight:500;padding:1px 9px;border-radius:5px;color:var(--text-3);display:flex;align-items:center;gap:5px}
.ckinds button svg{width:11px;height:11px}
.ckinds button:hover{color:var(--text-2)}
.ckinds button.on{background:var(--raise);color:var(--text)}
.ckinds button.on[data-kind=idea]{color:var(--note-ink)}
.chint{font-size:11.5px;color:var(--text-3);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:500 10.5px var(--mono);padding:0 4px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;color:var(--text-3)}
.chint code{font:500 11px var(--mono);color:var(--text-3);background:rgba(255,255,255,.04);padding:0 3px;border-radius:3px}

/* evening prompt */
.prompt-item .pdot{position:absolute;left:-28px;top:15px;width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--text-4);background:var(--bg)}
.prompt{display:flex;align-items:center;gap:12px;width:100%;padding:9px 14px;border:1px dashed var(--line-2);border-radius:10px;color:var(--text-3);font-size:13.5px;transition:all .15s}
.prompt:hover{border-color:rgba(60,207,165,.55);color:var(--text-2);background:rgba(60,207,165,.04)}
.prompt .time{color:var(--text-3)}
.prompt svg{width:14px;height:14px;color:var(--text-3)}
.prompt .pt{font-weight:600;color:var(--text-2)}

/* ───────── right column panels ───────── */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 15px 10px;margin-bottom:10px}
.panel:last-child{margin-bottom:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ph h3{font-size:13.5px;font-weight:600;letter-spacing:.005em}
.pmeta{font:500 11.5px var(--mono);color:var(--text-3)}
.prog{height:3px;background:var(--line);border-radius:3px;margin:8px 0 1px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--note),#7be0c3);border-radius:3px;transition:width .4s var(--ease)}
.gh{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:10px 0 2px}
.gh svg{width:13px;height:13px}
.g-lin .gh{color:var(--linear-ink)}
.g-ag .gh{color:var(--agent-ink)}
.g-mine .gh{color:var(--text-3)}
.gc{font:500 10.5px var(--mono);color:var(--text-4);letter-spacing:0}
.todo{position:relative;display:flex;align-items:flex-start;gap:10px;padding:4px 8px;margin:0 -8px;border-radius:8px;transition:background .15s}
.todo.mine{padding-right:30px}
.todo:hover{background:rgba(255,255,255,.03)}
.lstat{flex:none;width:18px;height:18px;margin-top:1px;display:grid;place-items:center;border-radius:50%;transition:transform .15s}
.lstat:hover{transform:scale(1.12)}
.lstat svg{width:16px;height:16px}
.cb{flex:none;width:16px;height:16px;margin-top:2px;border-radius:5px;box-shadow:inset 0 0 0 1.5px #4a5666;display:grid;place-items:center;color:#06150f;transition:all .15s}

    : [{ key: 'empty', cls: 'empty-note', html: 'No links on this Daily Note.' }]);
  $('#mentWrap').hidden = !ment.length;
  patch($('#lMent'), ment.map(([n, c]) => ({ key: 'M' + n, cls: 'lk ment', html: `<a class="wl" data-act="link" data-link="${esc(n)}"><i>[[</i>${esc(n)}<i>]]</i></a><span class="lc">×${c}</span>` })));
}

function renderAll() { renderHeader(); renderTimeline(); renderSide(); }

/* ───────── click-to-edit ───────── */
let editing = null;
function placeCaret(el, ev) {
  const sel = getSelection(); let r = null;
  if (ev && document.caretRangeFromPoint) { r = document.caretRangeFromPoint(ev.clientX, ev.clientY); if (r && !el.contains(r.startContainer)) r = null; }
  if (!r) { r = document.createRange(); r.selectNodeContents(el); r.collapse(false); }
  sel.removeAllRanges(); sel.addRange(r);
}
function beginEdit(target, raw, opts) {
  if (editing) editing.finish(true);
  const host = opts.host;
  host.dataset.editing = '1';
  target.textContent = raw;
  target.classList.add('editing');
  target.contentEditable = 'plaintext-only';
  if (target.contentEditable !== 'plaintext-only') target.contentEditable = 'true';
  target.focus();
  placeCaret(target, opts.ev);
  let finished = false;
  const onKey = ev => {
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); done(true, 'enter'); }
    else if (ev.key === 'Escape') { ev.preventDefault(); done(false); }
    else if (ev.key === 'Backspace' && opts.backspaceEmpty && target.textContent === '') { ev.preventDefault(); done(true, 'backspace'); }
  };
  const onBlur = () => done(true, 'blur');
  function done(save, how) {
    if (finished) return; finished = true;
    target.removeEventListener('keydown', onKey); target.removeEventListener('blur', onBlur);
    target.contentEditable = 'false'; target.removeAttribute('contenteditable'); target.classList.remove('editing');
    delete host.dataset.editing; host._html = null;
    const h2 = target.closest('[data-k]'); if (h2) h2._html = null;
    editing = null;
    const val = save ? target.innerText.replace(/ /g, ' ').replace(/\s+$/, '').replace(/^\s+/, '') : raw;
    opts.onCommit(val, how);
  }
  target.addEventListener('keydown', onKey); target.addEventListener('blur', onBlur);
  editing = { finish: done, host };
}

function editEntry(id, ev) {
  const { e, d } = findEntry(id); if (!e) return;
  const it = itemByKey('e:' + id); if (!it) return;
  const body = it.el.querySelector('.body');
  beginEdit(body, e.text, { host: it.el, ev, onCommit: val => {
    if (!val) {
      const i = d.entries.indexOf(e); if (i < 0) return renderAll();
      d.entries.splice(i, 1);
      if (e.label === 'Evening' && d.evening) d.evening.open = true;
      else if (e.text) toast('Entry deleted', { label: 'Undo', fn: () => { d.entries.push(e); renderAll(); } });
    } else e.text = val;
    renderAll();
  } });
}
function editNote(mid, nid, ev) {
  const m = findMeeting(mid); if (!m) return;
  const n = m.notes.find(x => x.id === nid); if (!n) return;
  const mi = itemByKey('m:' + mid); if (!mi) return;
  const li = mi.el.querySelector(`li[data-k="${nid}"]`); if (!li) return;
  beginEdit(li.querySelector('.ntext'), n.text, { host: li, ev, backspaceEmpty: true, onCommit: (val, how) => {
    const idx = m.notes.indexOf(n);
    if (idx < 0) return renderAll();
    if (!val) {
      m.notes.splice(idx, 1); renderAll();
      if (how === 'backspace' && idx > 0) editNote(mid, m.notes[idx - 1].id);
      return;
    }
    n.text = val;
    if (how === 'enter') { const nn = { id: uid('n'), text: '' }; m.notes.splice(idx + 1, 0, nn); renderAll(); editNote(mid, nn.id); return; }
    renderAll();
  } });
}
function editTime(id) {
  const { e, d } = findEntry(id); if (!e) return;
  const it = itemByKey('e:' + id); if (!it) return;
  if (editing) editing.finish(true);
  const btn = it.el.querySelector('.time');
  it.el.dataset.editing = '1';
  const inp = document.createElement('input');
  inp.className = 'time-in'; inp.value = fmt(e.t); inp.maxLength = 5; inp.spellcheck = false; inp.setAttribute('aria-label', 'Entry time');
  btn.replaceWith(inp); inp.focus(); inp.select();
  let fin = false;
  const done = save => {
    if (fin) return; fin = true;
    delete it.el.dataset.editing; it.el._html = null;
    if (save) {
      const mm = inp.value.trim().match(/^(\d{1,2})[:.h]?(\d{2})$/);
      if (mm && +mm[2] < 60 && +mm[1] < 24) {
        const t = clamp(+mm[1] * 60 + +mm[2], DAY0, DAY1 - 5);
        const mt = d.meetings.find(x => t >= x.t && t < x.end);
        if (mt) {
          if (e.text) mt.notes.push({ id: uid('n'), text: e.text });
          d.entries.splice(d.entries.indexOf(e), 1);
          state.expanded.add(mt.id);
          toast(`Moved into the ${esc(mt.title)} notes`);
        } else { e.t = t; e.seq = nextSeq(); }
        if (t !== +mm[1] * 60 + +mm[2]) toast('The timeline runs 07:00–22:00');
      } else if (inp.value.trim() !== fmt(e.t)) toast('Use a time like 14:05');
    }
    renderAll();
    if (save) setTimeout(() => flashItem('e:' + id), 360);
  };
  inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); done(true); } else if (ev.key === 'Escape') { ev.preventDefault(); done(false); } });
  inp.addEventListener('blur', () => done(true));
}
function editTodo(id, ev) {
  const t = findTodo(id); if (!t) return;
  const row = side.querySelector(`#lMine [data-k="${id}"]`); if (!row) return;
  beginEdit(row.querySelector('.ttext'), t.text, { host: row, ev, onCommit: val => {
    if (!val) deleteTodo(id); else { t.text = val; renderAll(); }
  } });
}
function deleteTodo(id) {
  const i = todos.findIndex(t => t.id === id); if (i < 0) return;
  const [t] = todos.splice(i, 1);
  renderAll();
  toast(`Todo deleted`, { label: 'Undo', fn: () => { todos.splice(i, 0, t); renderAll(); } });
}
function addDraftAt(t) {
  const d = data[state.day];
  const en = { id: uid('e'), t, kind: 'note', text: '', seq: nextSeq() };
  d.entries.push(en);
  renderTimeline();
  editEntry(en.id);
}

/* ───────── Todo actions ───────── */
function toggleTodo(id) {
  const t = findTodo(id); if (!t) return;
  t.done = !t.done;
  if (t.origin === 'linear') {
    if (t.done) { t.prevStatus = t.status; t.status = 'Done'; } else t.status = t.prevStatus && t.prevStatus !== 'Done' ? t.prevStatus : 'Todo';
  }
  if (t.done) { t.doneAt = t.day === TODAY ? NOW : (t.doneAt0 != null ? t.doneAt0 : 1080); t.doneSeq = nextSeq(); }
  else t.doneAt = null;
  renderAll();
  if (t.done) { flashItem('d:' + id); if (t.day === TODAY) setTimeout(() => ensureVisible('d:' + id), 50); }
}
function acceptSugg(id) {
  const t = findTodo(id); if (!t) return;
  t.state = 'accepted'; t.order = 1000 + nextSeq(); t.done = false;
  t.addedAt = NOW; t.addedSeq = nextSeq();
  if (state.lastDismissed === id) state.lastDismissed = null;
  renderAll();
  flash(side.querySelector(`#lMine [data-k="${id}"]`), true);
  flashItem('a:' + id);
}
function dismissSugg(id) {
  const t = findTodo(id); if (!t) return;
  t.state = 'dismissed'; state.lastDismissed = id;
  renderAll();
}

/* ───────── composer ───────── */
function setKind(k) {
  state.kind = k;
  compEl.querySelectorAll('[data-kind]').forEach(b => { b.classList.toggle('on', b.dataset.kind === k); b.setAttribute('aria-checked', b.dataset.kind === k); });
  const ta = compEl.querySelector('textarea');
  ta.placeholder = k === 'todo' ? `A Todo to add, stamped ${fmt(NOW)}…` : k === 'idea' ? `An idea, stamped ${fmt(NOW)}…` : `What's happening? Press Enter to stamp it at ${fmt(NOW)}.`;
}
function autoGrow(ta) { ta.style.height = '24px'; ta.style.height = Math.min(168, ta.scrollHeight) + 'px'; }
function submitComposer(ta) {
  let text = ta.value.trim(); if (!text) return;
  let kind = state.kind, m;
  if ((m = text.match(/^\[ ?\]\s*([\s\S]+)$/))) { kind = 'todo'; text = m[1].trim(); }
  else if ((m = text.match(/^!\s*([\s\S]+)$/))) { kind = 'idea'; text = m[1].trim(); }
  if (!text) return;
  let key;
  if (kind === 'todo') {
    const t = { id: uid('td'), day: TODAY, origin: 'mine', text, done: false, addedAt: NOW, addedSeq: nextSeq(), order: 1000 + nextSeq() };
    todos.push(t); key = 'a:' + t.id;
    renderAll(); flash(side.querySelector(`#lMine [data-k="${t.id}"]`));
  } else {
    const e = { id: uid('e'), t: NOW, kind, text, seq: nextSeq() };
    data[TODAY].entries.push(e); key = 'e:' + e.id;
    renderAll();
  }
  ta.value = ''; autoGrow(ta); setKind('note');
  flashItem(key);
  setTimeout(() => ensureVisible('composer'), 60);
}

/* ───────── toasts ───────── */
function toast(msg, action) {
  const box = $('#toasts');
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `<span>${msg}</span>`;
  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { action.fn(); t.remove(); }; t.appendChild(b); }
  box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 240); }, action ? 5200 : 2600);
}

/* ───────── day navigation ───────── */
function initialScroll() {
  const first = curItems.find(it => it.type !== 'prompt');
  if (!first) { tlwrap.scrollTop = 0; return; }
  let top = first.top - 44;
  if (state.day === TODAY) { const now = yOf(NOW); top = Math.min(top, now - tlwrap.clientHeight * 0.45); }
  tlwrap.scrollTop = Math.max(0, top);
}
function goTo(k) {
  if (!data[k] || k === state.day) return;
  if (editing) editing.finish(true);
  state.day = k;
  lane.classList.add('no-anim');
  lane.classList.remove('swap'); void lane.offsetWidth; lane.classList.add('swap');
  hideGhost();
  renderAll();
  initialScroll();
  requestAnimationFrame(() => requestAnimationFrame(() => lane.classList.remove('no-anim')));
}
function step(dir) { const i = DAY_KEYS.indexOf(state.day) + dir; if (i >= 0 && i < DAY_KEYS.length) goTo(DAY_KEYS[i]); }

/* ───────── hover-to-add on empty time ───────── */
let ghostT = null, downWhileEditing = false;
function hideGhost() { ghost.classList.remove('on'); lane.classList.remove('can-add'); ghostT = null; }
lane.addEventListener('mousemove', ev => {
  if (ev.target.closest('.item') || editing || ev.buttons) { hideGhost(); return; }
  const r = lane.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (x < 66) { hideGhost(); return; }
  let t = clamp(Math.round(tOf(y) / 5) * 5, DAY0, DAY1 - 5);
  if (data[state.day].meetings.some(m => t >= m.t && t < m.end)) { hideGhost(); return; }
  ghostT = t;
  ghost.style.top = yOf(t) + 'px';
  ghost.firstChild.textContent = `+ Add an entry at ${fmt(t)}`;
  ghost.classList.add('on'); lane.classList.add('can-add');
});
lane.addEventListener('mouseleave', hideGhost);
document.addEventListener('mousedown', ev => {
  const a = document.activeElement;
  downWhileEditing = !!editing || (a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.value !== '');
}, true);
lane.addEventListener('click', ev => {
  if (ev.target.closest('.item')) return;
  if (downWhileEditing) { downWhileEditing = false; return; }
  if (ghostT != null) { const t = ghostT; hideGhost(); addDraftAt(t); }
});

/* ───────── delegated clicks ───────── */
document.addEventListener('click', ev => {
  if (ev.target.isContentEditable) return;
  const a = ev.target.closest('[data-act]'); if (!a) return;
  const id = a.dataset.id;
  switch (a.dataset.act) {
    case 'edit': editEntry(id, ev); break;
    case 'time': editTime(id); break;
    case 'kind': { const { e } = findEntry(id); if (e) { e.kind = e.kind === 'idea' ? 'note' : 'idea'; renderAll(); flashItem('e:' + id); } break; }
    case 'del': { const { e, d } = findEntry(id); if (!e) break; d.entries.splice(d.entries.indexOf(e), 1); if (e.label === 'Evening' && d.evening) d.evening.open = true; renderAll();
      toast('Entry deleted', { label: 'Undo', fn: () => { d.entries.push(e); if (e.label === 'Evening' && d.evening) d.evening.open = false; renderAll(); } }); break; }
    case 'toggle': {
      if (getSelection().toString()) break;
      const was = state.expanded.has(id);
      was ? state.expanded.delete(id) : state.expanded.add(id);
      renderTimeline();
      if (!was) { const m = findMeeting(id); setTimeout(() => ensureVisible('m:' + id), 380); if (m && !m.notes.length) itemByKey('m:' + id).el.querySelector('input').focus({ preventScroll: true }); }
      break;
    }
    case 'note-edit': { const li = a.closest('li'); const mi = a.closest('.mtg'); editNote(mi.dataset.k.slice(2), li.dataset.k, ev); break; }
    case 'evening': {
      const d = data[TODAY]; d.evening.open = false;
      const e = { id: uid('e'), t: d.evening.t, kind: 'note', label: 'Evening', text: '', seq: nextSeq() };
      d.entries.push(e); renderTimeline(); editEntry(e.id); break;
    }
    case 'kindsel': setKind(a.dataset.kind); compEl.querySelector('textarea').focus(); break;
    case 'link': ev.preventDefault(); toast(`<b>[[${esc(a.dataset.link)}]]</b> would open its note. Not part of this prototype.`); break;
    case 'todo-toggle': toggleTodo(id); break;
    case 'todo-edit': editTodo(id, ev); break;
    case 'todo-del': deleteTodo(id); break;
    case 'linear-open': { const t = findTodo(id); toast(`Opens <b>${t.key}</b> in the Linear Section.`); break; }
    case 'accept': acceptSugg(id); break;
    case 'dismiss': dismissSugg(id); break;
    case 'undo-dismiss': { const t = findTodo(id); if (t) { t.state = 'suggested'; state.lastDismissed = null; renderAll(); flash(side.querySelector(`#lAg [data-k="${id}"]`), true); } break; }
    case 'src': {
      const t = findTodo(id); if (!t) break;
      if (t.source.type === 'email') { toast('Opens the email from Dana in the Email Section.'); break; }
      if (state.day !== TODAY) goTo(TODAY);
      state.expanded.add(t.source.meeting); renderTimeline();
      setTimeout(() => {
        scrollToItem('m:' + t.source.meeting, 120);
        const li = itemByKey('m:' + t.source.meeting).el.querySelector(`li[data-k="${t.source.note}"]`);
        setTimeout(() => flash(li ? li.querySelector('.ntext') : null, true), 300);
      }, 60);
      break;
    }
    case 'to-sugg': { const row = side.querySelector(`#lAg [data-k="${id}"]`); if (row) { row.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); flash(row, true); } break; }
    case 'jump': scrollToItem('e:' + id, 160); setTimeout(() => flashItem('e:' + id), 250); break;
    case 'unlink': { const d = data[state.day]; const i = d.links.indexOf(a.dataset.name); if (i >= 0) { d.links.splice(i, 1); renderSide(); } break; }
    case 'day': goTo(a.dataset.day); break;
    case 'prev': step(-1); break;
    case 'next': step(1); break;
    case 'today': goTo(TODAY); break;
    case 'section': toast(`Only the Notes Section exists in this prototype.`); break;
  }
});

/* ───────── inputs ───────── */
document.addEventListener('keydown', ev => {
  const t = ev.target;
  if (t.id === 'comp') {
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); submitComposer(t); }
    else if (ev.key === 'Escape') t.blur();
    return;
  }
  if (t.matches && t.matches('input[data-add-note]')) {
    if (ev.key === 'Enter' && t.value.trim()) {
      const m = findMeeting(t.dataset.addNote); m.notes.push({ id: uid('n'), text: t.value.trim() }); t.value = '';
      renderAll(); const li = itemByKey('m:' + m.id).el.querySelector('.mtg-notes li:last-child'); flash(li && li.querySelector('.ntext'));
    } else if (ev.key === 'Escape') t.blur();
    return;
  }
  if (t.id === 'addTodo' && ev.key === 'Enter' && t.value.trim()) {
    const td = { id: uid('td'), day: state.day, origin: 'mine', text: t.value.trim(), done: false, order: 1000 + nextSeq() };
    if (state.day === TODAY) { td.addedAt = NOW; td.addedSeq = nextSeq(); }
    todos.push(td); t.value = ''; renderAll(); flash(side.querySelector(`#lMine [data-k="${td.id}"]`)); return;
  }
  if (t.id === 'addIdea' && ev.key === 'Enter' && t.value.trim()) {
    const e = { id: uid('e'), t: NOW, kind: 'idea', text: t.value.trim(), seq: nextSeq() };
    data[TODAY].entries.push(e); t.value = ''; renderAll();
    flash(side.querySelector(`#lIdeas [data-k="${e.id}"] .idea-in`)); flashItem('e:' + e.id); return;
  }
  if (t.id === 'addLink' && ev.key === 'Enter' && t.value.trim()) {
    const n = t.value.trim().replace(/^\[\[|\]\]$/g, '').trim(); const d = data[state.day];
    if (n && !d.links.includes(n)) d.links.push(n);
    t.value = ''; renderSide(); return;
  }
  if (/^(INPUT|TEXTAREA)$/.test(t.tagName) && ev.key === 'Escape') { t.blur(); return; }
  const typing = t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  if (typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.key === '[') step(-1);
  else if (ev.key === ']') step(1);
  else if (ev.key === 't') goTo(TODAY);
  else if ((ev.key === 'n' || ev.key === '/') && state.day === TODAY) { ev.preventDefault(); const ta = compEl.querySelector('textarea'); ta.focus({ preventScroll: true }); ensureVisible('composer'); }
});
document.addEventListener('input', ev => { if (ev.target.id === 'comp') autoGrow(ev.target); });

/* ───────── boot ───────── */
buildHeat();
buildGrid();
buildComposer();
renderAll();
initialScroll();
const settle = () => { layout(); initialScroll(); requestAnimationFrame(() => requestAnimationFrame(() => lane.classList.remove('no-anim'))); };
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(settle);
})();
</script>
</body>
