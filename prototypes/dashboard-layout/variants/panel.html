<!-- PROTOTYPE — throwaway. Dashboard variant PANEL: Control panel. -->
<!--
  Intent: the Dashboard is an instrument panel, one fixed module per Section bolted to the A–H / 01–24 drawing grid, all visible at once; every Section is a sheet with the same spec / sheet / margin layout; Linear is the fully built Section.
-->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commander · Dashboard · PANEL Control panel</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=t==='light'?'light':'dark';})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --rail:72px; --rul:22px; --hdr:64px; --top:86px; --left:94px; --in:7px; --mh:28px;
    --sans:'Archivo', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  html[data-theme=dark]{
    color-scheme:dark;
    --bg:#141516; --sheet:#1B1C1E; --raise:#25262A;
    --ink:#EEECE7; --text:#D3D1CB; --muted:#8F8D87; --faint:#5E5D59;
    --line:rgba(238,236,231,.15); --line2:rgba(238,236,231,.075);
    --grid:rgba(238,236,231,.065); --grid2:rgba(238,236,231,.026); --cross:rgba(238,236,231,.28);
    --hatch:rgba(238,236,231,.08);
    --org:#FF5F00; --on-org:#141414; --org-ink:#FF5F00; --org-soft:rgba(255,95,0,.14); --focus:rgba(255,95,0,.06); --sel:rgba(255,95,0,.32);
  }
  html[data-theme=light]{
    color-scheme:light;
    --bg:#D8D5CE; --sheet:#E9E7E2; --raise:#F3F1ED;
    --ink:#1C1D1F; --text:#2A2B2D; --muted:#67645F; --faint:#9B978F;
    --line:rgba(28,29,31,.21); --line2:rgba(28,29,31,.095);
    --grid:rgba(28,29,31,.085); --grid2:rgba(28,29,31,.035); --cross:rgba(28,29,31,.36);
    --hatch:rgba(28,29,31,.1);
    --org:#E65600; --on-org:#141414; --org-ink:#B24200; --org-soft:rgba(230,86,0,.13); --focus:rgba(230,86,0,.075); --sel:rgba(230,86,0,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:14px; line-height:1.5; letter-spacing:-.003em;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overflow:hidden;
  }
  ::selection{background:var(--sel)}
  button{font:inherit;color:inherit;border-radius:0}
  button:focus-visible,a:focus-visible{outline:2px solid var(--org);outline-offset:-2px}
  .i{width:1em;height:1em;flex:none;display:block}
  .led{display:inline-block;flex:none;width:7px;height:7px;background:var(--org)}
  kbd{
    font:600 10px/1 var(--mono); letter-spacing:.02em; min-width:20px; height:19px; padding:0 5px;
    border:1px solid var(--line); color:var(--ink); display:inline-flex; align-items:center; justify-content:center; white-space:nowrap;
  }
  .hatch{background-image:repeating-linear-gradient(-45deg,var(--hatch) 0 1px,transparent 1px 6px)}

  /* ================= exposed grid ================= */
  .gridwrap{position:fixed;left:var(--left);top:var(--top);right:0;bottom:0;z-index:0;pointer-events:none}
  .gridwrap svg{display:block;width:100%;height:100%}
  .gridwrap .gc{stroke:var(--grid);stroke-width:1;fill:none}
  .gridwrap .gr{stroke:var(--grid2);stroke-width:1;fill:none}
  .gridwrap .gx{stroke:var(--cross);stroke-width:1;fill:none}

  /* ================= Section rail ================= */
  .rail{position:fixed;inset:0 auto 0 0;width:var(--rail);z-index:30;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .brand{height:var(--hdr);flex:none;border-bottom:1px solid var(--line);display:grid;place-items:center}
  .brand .mark{width:36px;height:36px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 18px/1 var(--sans);font-stretch:125%;letter-spacing:-.02em;position:relative}
  .brand .mark::after{content:'';position:absolute;right:0;bottom:0;width:7px;height:7px;background:var(--org)}
  .rail-cap{height:var(--rul);flex:none;border-bottom:1px solid var(--line);font:600 8.5px/var(--rul) var(--mono);letter-spacing:.16em;color:var(--faint);text-align:center;text-transform:uppercase}
  .rail nav{display:flex;flex-direction:column}
  .ri{
    position:relative;height:58px;flex:none;border:0;border-bottom:1px solid var(--line2);background:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0;
    color:var(--muted);text-decoration:none;cursor:pointer;width:100%;
  }
  .ri .ix{position:absolute;left:6px;top:5px;font:500 8px/1 var(--mono);color:var(--faint);letter-spacing:.04em}
  .ri .ct{position:absolute;right:5px;top:4px;font:600 8.5px/1 var(--mono);color:var(--ink);letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .ri .ct:empty{display:none}
  .ri svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter}
  .ri .cd{font:600 8.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase}
  .ri:hover{color:var(--ink);background:var(--raise)}
  .ri.on{background:var(--ink);color:var(--bg)}
  .ri.on .ix,.ri.on .ct{color:var(--bg)}
  .ri.on .ix{opacity:.55}
  .ri::after{
    content:attr(data-tip);position:absolute;left:calc(100% + 1px);top:50%;transform:translateY(-50%);
    background:var(--ink);color:var(--bg);font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
    padding:8px 10px;white-space:nowrap;opacity:0;pointer-events:none;z-index:5;
  }
  .ri:hover::after,.ri:focus-visible::after{opacity:1}
  .rail .spacer{flex:1}
  .ri.thm{border-top:1px solid var(--line)}
  .avatar{height:58px;flex:none;border-top:1px solid var(--line2);display:grid;place-items:center}
  .avatar span{width:30px;height:30px;border:1px solid var(--line);display:grid;place-items:center;font:600 10px/1 var(--mono);letter-spacing:.06em;color:var(--ink)}

  /* ================= Header ================= */
  .hdr{position:fixed;top:0;left:var(--rail);right:0;height:var(--hdr);z-index:26;background:var(--bg);border-bottom:1px solid var(--line);display:grid;grid-template-columns:var(--rul) repeat(8,minmax(0,1fr))}
  .hdr > *{border-left:1px solid var(--line);min-width:0}
  .hdr > .h-corner{border-left:0;position:relative}
  .h-corner::before,.h-corner::after{content:'';position:absolute;background:var(--faint)}
  .h-corner::before{left:6px;right:6px;top:50%;height:1px}
  .h-corner::after{top:calc(50% - 5px);height:11px;left:50%;width:1px}
  .h-id{padding:11px 14px 0;display:flex;flex-direction:column;gap:4px}
  .h-sec{font:500 8.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .h-title{font:800 13px/1 var(--sans);font-stretch:112%;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .h-clock{display:flex;align-items:center;gap:7px;font:500 10.5px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.04em;margin-top:2px}
  .h-clock .led{width:6px;height:6px}
  .h-clock small{font-size:8.5px;color:var(--muted);letter-spacing:.14em}
  .h-wk{padding:11px 14px 0;display:flex;flex-direction:column;gap:6px}
  .h-wkn{font:700 13px/1 var(--sans);font-stretch:112%;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
  .h-wkr{font:500 9.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .h-mid{grid-column:4 / 7;display:grid;grid-template-columns:2fr 1fr}
  .hm{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 14px;min-width:0;border-left:1px solid var(--line2);background:none;border-top:0;border-right:0;border-bottom:0;text-align:left;cursor:default}
  .hm:first-child{border-left:0}
  button.hm{cursor:pointer}
  button.hm:hover{background:var(--raise)}
  .hm .k{display:flex;align-items:center;gap:7px;font:500 8.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .hm .k .led{width:6px;height:6px}
  .hm .v{font:650 14px/1.15 var(--sans);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
  .hm .v small{font:500 10px/1 var(--mono);letter-spacing:.08em;color:var(--org-ink);margin-left:6px;text-transform:uppercase}
  .hm .v .m{font:500 10px/1 var(--mono);letter-spacing:.08em;color:var(--muted);margin-left:6px;text-transform:uppercase}
  .gauge{display:flex;gap:2px;height:8px}
  .gauge i{flex:1;border:1px solid var(--muted)}
  .gauge i.f{background:var(--ink);border-color:var(--ink)}
  .gauge i.me{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--bg)}
  .gauge i.o{background-image:repeating-linear-gradient(-45deg,var(--hatch) 0 1px,transparent 1px 4px)}

  /* Titanus status module */
  .ttn{grid-column:7 / 10;display:grid;grid-template-columns:78px minmax(0,1fr) auto;position:relative}
  .ttn::before{content:'';position:absolute;left:-1px;top:0;bottom:0;width:3px;background:var(--org)}
  .t-count{display:flex;flex-direction:column;justify-content:center;padding-left:16px;border-right:1px solid var(--line2)}
  .t-count b{font:800 33px/.9 var(--sans);font-stretch:125%;color:var(--org-ink);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .t-count span{font:500 8px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:5px}
  .ttn.empty .t-count b{color:var(--faint)}
  .t-info{padding:0 14px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
  .t-l1{display:flex;align-items:center;gap:10px;overflow:hidden;font:600 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
  .t-l1 .pres{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;padding-left:10px;border-left:1px solid var(--line)}
  .t-l1 .pres .led{width:6px;height:6px}
  .ttn.away .pres .led{background:transparent;box-shadow:inset 0 0 0 1px var(--muted)}
  .t-l2{font:500 14px/1.2 var(--sans);color:var(--text);letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ask-btn{border:0;border-left:1px solid var(--line);background:none;padding:0 16px 0 15px;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;font:600 10px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
  .ask-btn kbd{border-color:currentColor;color:inherit;min-width:22px;height:22px}
  .ask-btn:hover,.ask-btn[aria-expanded=true]{background:var(--org);color:var(--on-org)}

  /* ================= Rulers ================= */
  .rul-x{position:fixed;top:var(--hdr);left:var(--rail);right:0;height:var(--rul);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:grid;grid-template-columns:var(--rul) repeat(8,minmax(0,1fr))}
  .rul-x .k{font:600 8px/var(--rul) var(--mono);color:var(--faint);text-align:center;letter-spacing:.04em}
  .rul-x .c{
    position:relative;border-left:1px solid var(--line);font:600 9.5px/1 var(--mono);color:var(--muted);padding:4px 0 0 6px;
    background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10%),linear-gradient(var(--line),var(--line));
    background-size:100% 4px,1px 8px;background-position:0 100%,50% 100%;background-repeat:no-repeat;
  }
  .rul-y{position:fixed;top:var(--top);left:var(--rail);bottom:0;width:var(--rul);z-index:20;background:var(--bg);border-right:1px solid var(--line);display:grid;grid-template-rows:repeat(24,minmax(0,1fr))}
  .rul-y .r{
    position:relative;border-top:1px solid var(--line);font:600 8px/1 var(--mono);color:var(--muted);padding:4px 0 0 3px;letter-spacing:.02em;
    background-image:repeating-linear-gradient(180deg,var(--line) 0 1px,transparent 1px 25%);background-size:4px 100%;background-position:100% 0;background-repeat:no-repeat;
  }
  .rul-y .r:first-child{border-top:0}
  .rul-x .c.hv,.rul-y .r.hv{color:var(--ink);background-color:var(--raise)}
  .rul-x .c.hv::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ink)}
  .rul-y .r.hv::after{content:'';position:absolute;top:0;bottom:0;right:0;width:2px;background:var(--ink)}
  .mk{position:absolute;display:none;pointer-events:none}
  .rul-x .mk{top:0;bottom:0;width:1px;left:0}
  .rul-y .mk{left:0;right:0;height:1px;top:0}
  .mk.m{background:var(--ink);opacity:.45}

  /* ================= View grid (every view sits on the A–H / 01–24 sheet) ================= */
  .view{
    position:fixed;left:var(--left);top:var(--top);right:0;bottom:0;z-index:1;
    display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(24,minmax(0,1fr));
  }
  .view[hidden]{display:none}

  /* ================= Dashboard modules ================= */
  .mod{
    margin:var(--in);min-width:0;min-height:0;background:var(--sheet);border:1px solid var(--line);
    display:flex;flex-direction:column;position:relative;overflow:hidden;
  }
  .mod:hover{border-color:var(--muted)}
  .mod.ttm::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--org);z-index:2}
  .mh{
    flex:none;height:var(--mh);display:flex;align-items:stretch;border-bottom:1px solid var(--line);
    font:600 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;cursor:pointer;
  }
  .mh > span{display:flex;align-items:center;padding:0 10px;border-right:1px solid var(--line2);min-width:0}
  .mh .mtag{background:var(--ink);color:var(--sheet);border-right:0}
  .ttm .mh .mtag{background:var(--org);color:var(--on-org)}
  .mh .mt{color:var(--ink);font-weight:600}
  .mh .mpn{font-weight:500}
  .mh .sp{flex:1;border-right:0;padding:0}
  .mh .mco{color:var(--faint);font-weight:500;border-left:1px solid var(--line2)}
  .mh .mgo{border:0;border-left:1px solid var(--line);background:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ink)}
  .mh .mgo kbd{height:17px;min-width:17px;font-size:9px}
  .mh:hover .mgo,.mh .mgo:hover{background:var(--ink);color:var(--sheet)}
  .mh:hover .mgo kbd{border-color:currentColor;color:inherit}
  .mb{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
  .lab{font:500 8.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}

  /* generic item row */
  .it{
    display:flex;align-items:center;gap:9px;min-height:26px;padding:0 10px;border-bottom:1px solid var(--line2);
    font-size:13px;line-height:18px;color:var(--text);cursor:pointer;min-width:0;position:relative;
  }
  .it:hover{background:var(--raise)}
  .it .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .it .id{flex:none;font:500 11px/1 var(--mono);color:var(--muted);letter-spacing:.02em}
  .it .ag{flex:none;font:500 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .tag{flex:none;height:18px;padding:0 6px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);font:500 8.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .tag.inv{background:var(--ink);border-color:var(--ink);color:var(--sheet);font-weight:600}
  .tag.ttn-t{border-color:var(--org);color:var(--org-ink)}
  .tag.ttn-t .sq{width:6px;height:6px;background:currentColor}
  .tag.warn{border-style:dashed;border-color:var(--ink);color:var(--ink)}
  .flash{animation:flash 1.8s steps(12,end)}
  @keyframes flash{0%,40%{background:var(--org-soft);box-shadow:0 0 0 3px var(--org-soft)}100%{background:transparent;box-shadow:0 0 0 3px transparent}}

  /* checks + status glyphs */
  .check{flex:none;width:18px;height:18px;padding:0;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
  .check .box{width:14px;height:14px;border:1.5px solid var(--muted);display:grid;place-items:center;color:var(--sheet)}
  .check .box .i{width:10px;height:10px;opacity:0}
  .check:hover .box{border-color:var(--ink)}
  .done .check .box{background:var(--ink);border-color:var(--ink)}
  .done .check .box .i{opacity:1}
  .check .sbx{width:13px;height:13px;border:1.5px dashed var(--org)}
  .st{width:15px;height:15px;color:var(--ink);flex:none;display:block}
  .st .o{fill:none;stroke:currentColor;stroke-width:1.5}
  .st .od{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2.4 1.6}
  .st .ob{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-dasharray:1 2.2}
  .st .f{fill:currentColor}
  .st .k{fill:none;stroke:var(--sheet);stroke-width:1.8}
  .done .tt,.it.done .tt{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
  .mini{height:20px;padding:0 8px;border:1px solid var(--line);background:none;cursor:pointer;font:600 8.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);flex:none}
  .mini:hover{background:var(--raise);border-color:var(--ink)}
  .mini.acc{border-color:var(--org);color:var(--org-ink)}
  .mini.acc:hover{background:var(--org);color:var(--on-org)}
  .mini + .mini{margin-left:-5px}

  /* --- Calendar module --- */
  .cal{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,26%);flex:1;min-height:0}
  .tl{position:relative;margin:0 16px 0 14px;min-width:0}
  .tl-scale{position:absolute;left:0;right:0;top:0;height:18px;border-bottom:1px solid var(--line)}
  .tl-scale span{position:absolute;top:5px;transform:translateX(-50%);font:500 8.5px/1 var(--mono);color:var(--muted);letter-spacing:.04em}
  .tl-scale span::after{content:'';position:absolute;left:50%;top:9px;width:1px;height:4px;background:var(--line)}
  .tl-track{position:absolute;left:0;right:0;top:18px;height:26px;border-bottom:1px solid var(--line)}
  .tl-track .past{position:absolute;left:0;top:0;bottom:0;background-image:repeating-linear-gradient(-45deg,var(--hatch) 0 1px,transparent 1px 6px)}
  .tl-track .hr{position:absolute;top:0;bottom:0;width:1px;background:var(--line2)}
  .ev{position:absolute;top:5px;bottom:5px;border:1.5px solid var(--ink);background:var(--sheet);cursor:pointer;min-width:6px}
  .ev:hover{background:var(--ink)}
  .ev.past{border-color:var(--faint);background:var(--raise)}
  .ev.next{border-color:var(--org);background:var(--org-soft)}
  .ev.live{border-color:var(--org);background:var(--org)}
  .evl{position:absolute;top:50px;overflow:hidden;cursor:pointer;white-space:nowrap;padding-left:7px;border-left:1px solid var(--line)}
  .evl .a{font:500 9.5px/1 var(--mono);letter-spacing:.06em;color:var(--muted);display:flex;gap:0;align-items:center;white-space:nowrap;overflow:hidden}
  .evl .a b{margin-left:8px}
  .evl .a b{font-weight:600;color:var(--org-ink);letter-spacing:.14em}
  .evl .b{font:600 12.5px/1.25 var(--sans);color:var(--ink);overflow:hidden;text-overflow:ellipsis;margin-top:4px}
  .evl.past .b{color:var(--muted);font-weight:500}
  .evl.next{border-left-color:var(--org)}
  .evl:hover .b{text-decoration:underline;text-underline-offset:3px}
  .now{position:absolute;top:0;height:44px;width:2px;margin-left:-1px;background:var(--org);z-index:2}
  .now span{position:absolute;left:2px;top:0;background:var(--org);color:var(--on-org);font:600 8.5px/12px var(--mono);padding:0 4px;letter-spacing:.06em}
  .tmr{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
  .tmr .th{height:22px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--line2)}
  .tmr .it{border-bottom:1px solid var(--line2);font-size:12.5px}
  .tmr .it:last-child{border-bottom:0}
  .tmr .it .id{width:38px}

  /* --- Titanus module --- */
  .tq{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:12px 12px 10px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
  .tq:hover{background:var(--raise)}
  .tq b{font:800 46px/.85 var(--sans);font-stretch:125%;color:var(--org-ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .tq.empty b{color:var(--faint)}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:7px}
  .slots i{height:16px;border:1px solid var(--org);background:var(--org-soft);font:600 8.5px/14px var(--mono);font-style:normal;color:var(--org-ink);text-align:center;letter-spacing:.04em}
  .slots i.c{background:transparent;border-color:var(--line);color:var(--faint);background-image:repeating-linear-gradient(-45deg,var(--hatch) 0 1px,transparent 1px 4px)}
  .tq .lab{display:block}
  .tq-ask{flex:none;margin:10px 12px 0;height:34px;border:1px solid var(--ink);background:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 12px;font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
  .tq-ask kbd{border-color:currentColor;color:inherit}
  .tq-ask:hover,.tq-ask[aria-expanded=true]{background:var(--org);border-color:var(--org);color:var(--on-org)}
  .chan-h{display:flex;justify-content:space-between;align-items:center;margin:12px 12px 0;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .chan{margin:0 12px;list-style:none;padding:0}
  .chan li{display:grid;grid-template-columns:10px 76px minmax(0,1fr) auto;align-items:center;gap:7px;height:23px;border-bottom:1px solid var(--line2);font:500 10px/1 var(--mono);letter-spacing:.04em;color:var(--muted);white-space:nowrap}
  .chan li .led{width:6px;height:6px}
  .chan li b{font-weight:600;color:var(--ink);letter-spacing:.08em;text-transform:uppercase;font-size:9.5px}
  .chan li span{overflow:hidden;text-overflow:ellipsis}
  .chan li em{font-style:normal;color:var(--faint);font-variant-numeric:tabular-nums}
  .t-hint{margin:auto 12px 12px;height:32px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:var(--faint);cursor:not-allowed;font-size:13px}
  .t-hint .lab{color:var(--faint)}

  /* --- Todos module: origin matrix --- */
  .og{display:grid;grid-template-columns:84px minmax(0,1fr);border-bottom:1px solid var(--line)}
  .og:last-child{border-bottom:0}
  .og-l{border-right:1px solid var(--line2);padding:7px 0 7px 10px;display:flex;flex-direction:column;gap:5px}
  .og-l b{font:800 20px/1 var(--sans);font-stretch:125%;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .og-l.t b,.og-l.t .lab{color:var(--org-ink)}
  .og-r .it:last-child{border-bottom:0}
  .og-r .it{padding-left:8px}

  /* --- Email module --- */
  .ctrs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line);flex:none}
  .ctr{padding:9px 10px 8px;border-left:1px solid var(--line2);cursor:pointer;background:none;border-top:0;border-right:0;border-bottom:0;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
  .ctr:first-child{border-left:0}
  .ctr:hover{background:var(--raise)}
  .ctr b{font:800 30px/.9 var(--sans);font-stretch:125%;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .ctr.dim b{color:var(--muted);font-weight:600}
  .ctr.hot{background:var(--ink)}
  .ctr.hot b,.ctr.hot .lab{color:var(--sheet)}
  .sub{flex:none;height:22px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--line2)}
  .acct{display:flex;gap:12px;color:var(--muted)}
  .acct span{display:flex;align-items:center;gap:5px}
  .acct i{width:5px;height:5px;background:var(--muted)}
  .em .fr{flex:none;width:30%;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .em .tt{color:var(--text)}
  .em.replied .fr,.em.replied .tt{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
  .em{min-height:30px}
  .em .ft{flex:1;min-width:0;display:flex;align-items:center;gap:9px}
  .bbar{flex:none;display:flex;gap:2px;height:7px;margin:7px 10px;}
  .bbar i{display:block;min-width:2px;border:1px solid var(--muted)}
  .bbar i.r{background:var(--ink);border-color:var(--ink)}
  .bbar i.f{background:var(--muted);border-color:var(--muted)}
  .bbar i.n{background-image:repeating-linear-gradient(-45deg,var(--hatch) 0 1px,transparent 1px 4px)}
  @media (min-height:961px){
    .it{min-height:30px;font-size:13.5px}
    .em{min-height:46px}
    .em .ft{flex-direction:column;align-items:stretch;gap:3px}
    .em .fr{width:auto}
    .ls .it{min-height:31px}
    .og-r .it{min-height:31px}
    .tmr .it{min-height:30px}
    .bbar{height:9px;margin:9px 10px}
  }

  /* --- Linear module --- */
  .cyc{flex:none;padding:9px 10px 9px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;cursor:pointer}
  .cyc:hover{background:var(--raise)}
  .cyc .cn{font:700 12.5px/1.1 var(--sans);font-stretch:112%;text-transform:uppercase;letter-spacing:.03em;color:var(--ink);white-space:nowrap}
  .cyc .cn small{display:block;font:500 8.5px/1 var(--mono);letter-spacing:.14em;color:var(--muted);margin-top:4px}
  .cyc .pc{font:800 22px/1 var(--sans);font-stretch:125%;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .cyc .gauge{height:14px}
  .ls{display:grid;grid-template-columns:120px minmax(0,1fr)}
  .ls .sl{display:flex;align-items:center;gap:8px;padding-left:10px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);font:500 9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .ls .sl b{margin-left:auto;margin-right:9px;color:var(--ink);font-weight:600}
  .ls .it{padding-left:10px}

  /* --- GitHub module --- */
  .say{flex:none;margin:10px 10px 0;display:grid;grid-template-columns:auto minmax(0,1fr);border:1px solid var(--line)}
  .say .who{background:var(--org);color:var(--on-org);font:600 8.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg);padding:8px 5px;text-align:center}
  .say p{margin:0;padding:8px 11px 9px;font:500 13.5px/1.42 var(--sans);color:var(--ink);letter-spacing:-.006em}
  .ghs{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:10px 10px 0;border:1px solid var(--line2)}
  .ghs div{padding:6px 8px;border-left:1px solid var(--line2);display:flex;align-items:baseline;gap:7px;min-width:0}
  .ghs div:first-child{border-left:0}
  .ghs b{font:800 17px/1 var(--sans);font-stretch:125%;color:var(--ink);font-variant-numeric:tabular-nums}
  .ghs .lab{overflow:hidden;text-overflow:ellipsis}
  .ghl{margin-top:10px;border-top:1px solid var(--line)}
  .pr .id{width:116px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* --- Daily Note module --- */
  .dn-t{flex:none;padding:12px 12px 10px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .dn-t .wd{font:800 30px/.9 var(--sans);font-stretch:125%;text-transform:uppercase;letter-spacing:-.015em;color:var(--ink)}
  .dn-t .dt{font:300 14px/1.2 var(--sans);color:var(--muted);margin-top:6px}
  .dn-t .live{display:flex;align-items:center;gap:6px;font:600 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--org-ink)}
  .dn-t .live .led{width:6px;height:6px}
  .dn-x{flex:1;min-height:0;overflow:hidden;position:relative;padding:6px 12px 0 0;cursor:pointer}
  .dn-x::after{content:'';position:absolute;left:0;right:0;bottom:0;height:36px;background:linear-gradient(transparent,var(--sheet))}
  .dr{display:grid;grid-template-columns:38px minmax(0,1fr);align-items:baseline;font-size:12.5px;line-height:18px;padding:2px 0;color:var(--text)}
  .dr .n{font:500 8.5px/18px var(--mono);color:var(--faint);text-align:right;padding-right:10px}
  .dr.h{margin-top:7px;padding-top:6px;border-top:1px solid var(--line2)}
  .dr.h:first-child{margin-top:0;border-top:0}
  .dr.h .x{font:700 10.5px/18px var(--sans);font-stretch:118%;letter-spacing:.07em;text-transform:uppercase;color:var(--ink)}
  .dr.h .n{color:var(--muted)}
  .dr .ch{font:500 10px/1 var(--mono);border:1px solid var(--line);padding:1px 4px;margin-right:6px;color:var(--ink)}
  .dr .ch.nx{border-color:var(--org)}
  .dr .wl{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:3px}
  .dr .ph{color:var(--faint)}
  .dn-open{flex:none;margin:8px 12px 12px;height:34px;border:1px solid var(--ink);background:var(--ink);color:var(--sheet);cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 12px;font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
  .dn-open kbd{border-color:currentColor;color:inherit}
  .dn-open:hover{background:var(--org);border-color:var(--org);color:var(--on-org)}

  /* --- bottom band: key + title block --- */
  .band{margin:var(--in);min-width:0;min-height:0;border:1px solid var(--line);background:var(--bg);display:flex;font:500 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);overflow:hidden}
  .band.key{grid-column:1 / 3;grid-row:23 / 25;flex-direction:column;justify-content:center;gap:5px;padding:0 12px}
  .band.key div{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .band.key kbd{height:17px;min-width:17px;font-size:9px}
  .band.key .t kbd{border-color:var(--org);color:var(--org-ink)}
  .band.tb{grid-column:7 / 9;grid-row:23 / 25;display:grid;grid-template-columns:1.5fr 1fr 1fr;grid-template-rows:1fr 1fr}
  .band.tb div{border-left:1px solid var(--line2);border-top:1px solid var(--line2);padding:0 8px;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;white-space:nowrap}
  .band.tb div:nth-child(3n+1){border-left:0}
  .band.tb div:nth-child(-n+3){border-top:0}
  .band.tb small{font-size:7.5px;color:var(--faint);letter-spacing:.14em}
  .band.tb b{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis}

  /* ================= Section sheets (spec | sheet | margin) ================= */
  .spec{grid-column:1;grid-row:1 / 23;margin:var(--in) 12px 0 14px;container-type:inline-size;font-family:var(--mono);min-height:0;overflow:hidden}
  .sp-pn{display:flex;justify-content:space-between;align-items:center;gap:6px;padding-bottom:8px;border-bottom:2px solid var(--ink);font:600 10px/1 var(--mono);letter-spacing:.08em;color:var(--ink);white-space:nowrap;min-width:0}
  .sp-pn > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .sp-live{flex:none}
  .sp-live{display:inline-flex;align-items:center;gap:5px;color:var(--org-ink);font-size:9px;letter-spacing:.14em;text-transform:uppercase}
  .sp-live .led{width:6px;height:6px}
  .sp-num{font:800 min(96px,58cqw)/.8 var(--sans);font-stretch:125%;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1.25px var(--ink);margin:14px 0 10px -.03em;font-variant-numeric:tabular-nums}
  .sp-mo{font:500 9.5px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-bottom:12px;border-bottom:1px solid var(--line)}
  .sp-tab{margin:0}
  .sp-tab div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2);font:500 9px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase}
  .sp-tab dt{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sp-tab dd{margin:0;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sp-tab .ttnrow dd,.sp-tab .ttnrow dt{color:var(--org-ink)}
  .sp-foot{margin-top:9px;font:500 8.5px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .sp-views{margin-top:18px;display:flex;flex-direction:column}
  .sp-views .lab{margin-bottom:6px}
  .sp-views button{height:28px;border:1px solid var(--line);border-top:0;background:var(--bg);text-align:left;padding:0 9px;cursor:pointer;font:600 9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .sp-views .lab + button{border-top:1px solid var(--line)}
  .sp-views button:hover{color:var(--ink)}
  .sp-views button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  .sheet{grid-column:2 / 6;grid-row:1 / 23;margin:var(--in);min-width:0;min-height:0;background:var(--sheet);border:1px solid var(--line);display:flex;flex-direction:column}
  .sh-strip{flex:none;display:flex;align-items:stretch;height:30px;border-bottom:1px solid var(--line);font:500 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .sh-strip > span{display:flex;align-items:center;padding:0 12px;border-right:1px solid var(--line2);white-space:nowrap}
  .sh-strip > span.sp{flex:1;border-right:0}
  .sh-strip > span:last-child{border-right:0;border-left:1px solid var(--line2)}
  .sh-strip .eb{background:var(--ink);color:var(--sheet);font-weight:600}
  .sh-strip .pn{color:var(--ink);font-weight:600}
  .sh-body{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;position:relative}
  .sh-title{padding:20px 22px 18px 46px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:18px}
  .sh-title .wd{display:block;font:800 44px/.9 var(--sans);font-stretch:125%;text-transform:uppercase;letter-spacing:-.015em;color:var(--ink)}
  .sh-title .dt{display:block;margin-top:9px;font:300 19px/1.15 var(--sans);letter-spacing:-.01em;color:var(--muted)}
  .sh-title .big{font:800 44px/.9 var(--sans);font-stretch:125%;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.03em;text-align:right}
  .sh-title .big small{display:block;font:500 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px}
  .cycbar{padding:12px 22px 14px 46px;border-bottom:1px solid var(--line)}
  .cycbar .gauge{height:18px;gap:3px}
  .cycbar .lg{display:flex;gap:16px;margin-top:9px;flex-wrap:wrap}
  .cycbar .lg span{display:flex;align-items:center;gap:6px}
  .cycbar .lg i{width:10px;height:8px;border:1px solid var(--muted)}
  .cycbar .lg i.f{background:var(--ink);border-color:var(--ink)}
  .cycbar .lg i.me{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--bg)}
  .cycbar .lg i.mo{border:1.5px solid var(--ink)}
  .cycbar .lg i.o{background-image:repeating-linear-gradient(-45deg,var(--hatch) 0 1px,transparent 1px 4px)}
  .gauge i.mo{border:1.5px solid var(--ink)}

  /* section rows */
  .sgh{display:flex;align-items:center;gap:10px;height:34px;padding:4px 22px 0 46px;border-top:1px solid var(--line);position:relative;font:700 12.5px/1 var(--sans);font-stretch:118%;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
  .sgh:first-child{border-top:0}
  .sgh .bn,.srow .bn{position:absolute;left:8px;width:28px;text-align:right;font:500 9px/1 var(--mono);color:var(--faint);letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .sgh .bn{color:var(--muted);top:16px}
  .sgh .c{margin-left:auto;font:500 9.5px/1 var(--mono);letter-spacing:.12em;color:var(--muted)}
  .sgh .st{width:14px;height:14px}
  .srow{position:relative;display:flex;align-items:center;gap:11px;min-height:34px;padding:0 22px 0 46px;border-top:1px solid var(--line2);cursor:pointer;font-size:14px;line-height:20px;color:var(--ink)}
  .srow .bn{top:13px}
  .srow:hover{background:var(--raise)}
  .srow.sel{background:var(--focus);box-shadow:inset 3px 0 0 var(--org)}
  .srow.sel .bn{color:var(--org-ink);font-weight:600}
  .srow .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srow .id{flex:none;font:500 11.5px/1 var(--mono);color:var(--muted);letter-spacing:.02em;width:66px}
  .srow .ag{flex:none;font:500 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .srow.done .tt{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
  .srow .sub2{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srow.tall{min-height:50px;padding-top:6px;padding-bottom:6px}
  .srow.tall .bn{top:15px}
  .empty-row{padding:10px 22px 12px 46px;font-size:13px;color:var(--faint);border-top:1px solid var(--line2)}

  .side{grid-column:6 / 9;grid-row:1 / 23;margin:var(--in);min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px;overflow:auto;scrollbar-width:thin}
  .pane{background:var(--sheet);border:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .pane.grow{flex:1}
  .pane .ph{flex:none;height:28px;display:flex;align-items:stretch;border-bottom:1px solid var(--line);font:600 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .pane .ph > span{display:flex;align-items:center;padding:0 10px;border-right:1px solid var(--line2)}
  .pane .ph .eb{background:var(--ink);color:var(--sheet);font-weight:600;border-right:0}
  .pane .ph .pn{color:var(--ink);font-weight:600}
  .pane .ph .sp{flex:1;border-right:0;padding:0}
  .pane .ph > span:last-child:not(.sp){border-right:0;border-left:1px solid var(--line2)}
  .pane.ttp{border-color:var(--org)}
  .pane.ttp .ph .eb{background:var(--org);color:var(--on-org)}
  .pane .pb{padding:14px 16px 16px}

  /* Linear detail pane */
  .d-id{display:flex;align-items:center;gap:10px;font:600 11px/1 var(--mono);letter-spacing:.06em;color:var(--muted)}
  .d-t{margin:10px 0 0;font:750 24px/1.12 var(--sans);font-stretch:108%;letter-spacing:-.012em;color:var(--ink)}
  .props{margin:16px 0 0;border-top:1px solid var(--line)}
  .props div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);align-items:center}
  .props dt{font:500 9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .props dd{margin:0;font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:8px;min-width:0}
  .d-desc{margin:14px 0 0;flex:none;font-size:14px;line-height:21px;color:var(--text)}
  .d-sec{margin-top:16px;flex:none}
  .side .pb > .stsel{margin-top:auto}
  .side .pb > :nth-last-child(2){margin-bottom:16px}
  .d-sec .lab{display:block;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .lnk{display:flex;align-items:center;gap:9px;min-height:30px;border-bottom:1px solid var(--line2);font-size:13px;color:var(--ink);cursor:pointer;padding:0 2px}
  .lnk:hover{background:var(--raise)}
  .lnk .id{font:500 10.5px/1 var(--mono);color:var(--muted);flex:none}
  .lnk .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stsel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:auto;position:relative;top:0;flex:none;border:1px solid var(--line)}
  .stsel button{height:34px;border:0;border-left:1px solid var(--line2);background:none;cursor:pointer;font:600 8.5px/1.15 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 2px}

      ${S.mine.map(p => `<div class="srow" data-item="${p.id}" data-act="go" data-sec="linear" data-id="ENG-412"><span class="bn">${pad(++n, 3)}</span><span class="id" style="width:170px;white-space:nowrap">${p.repo} #${p.n}</span><span class="tt">${esc(p.t)}</span><span class="tag">ENG-412</span><span class="tag warn">✕ ${p.ci}</span></div>`).join('')}
      <div class="sgh"><span class="bn">${pad(++n, 3)}</span>Releases<span class="c">${pad(S.releases.length)}</span></div>
      ${S.releases.map(r => `<div class="srow" data-item="${r.id}" data-act="none"><span class="bn">${pad(++n, 3)}</span><span class="id" style="width:170px;white-space:nowrap">${r.repo}</span><span class="tt">${r.v}</span></div>`).join('')}
      </div></article>`;
    const side = `<aside class="side" ${area(6, 8, 1, 22)}>
      <div class="pane ttp"><div class="ph"><span class="eb">Titanus</span><span class="pn">Summary</span><span class="sp"></span><span>Since yesterday</span></div><p class="quote">${esc(S.summary)}</p></div>
      <div class="pane"><div class="ph"><span class="eb">Counts</span><span class="sp"></span><span>${S.gh.watching} repos</span></div><div class="bigq"><button type="button" data-act="none"><b>${S.gh.merged}</b><span class="lab">PRs merged</span></button><button type="button" data-act="none"><b>${pad(S.gh.opened)}</b><span class="lab">PRs opened</span></button><button type="button" data-act="none" class="dim"><b>${pad(S.gh.releases)}</b><span class="lab">Releases</span></button><button type="button" data-act="none" class="dim"><b>${pad(S.gh.repos)}</b><span class="lab">Repos active</span></button></div></div>
      </aside>`;
    return sp + sheet + side + band('github');
  }

  /* ------------------------------------------------------------------ */
  /* Header middle (per view)                                            */
  /* ------------------------------------------------------------------ */
  function headMid() {
    const nx = nextEvent(), cy = cycle();
    if (S.view === 'linear') return `<div class="hm"><span class="k">Cycle 41 · ends Tue · ${cy.done}/${cy.total}</span>${gaugeHTML()}</div><div class="hm"><span class="k">Complete</span><span class="v">${cy.pct}%</span></div>`;
    if (S.view === 'notes') return `<div class="hm"><span class="k"><i class="led"></i>Daily Note · Live</span><span class="v">Thursday 1 October <span class="m">DN-2026-274</span></span></div><div class="hm"><span class="k">Week 40</span><span class="v">3 notes</span></div>`;
    const nxt = nx ? `<button class="hm" type="button" data-act="go" data-sec="calendar" data-id="${nx.id}"><span class="k"><i class="led"></i>Next</span><span class="v">${nx.s} ${esc(nx.t)}<small data-countdown="${nx.id}">in ${dur(mins(nx.s) - nowMin())}</small></span></button>` : '<div class="hm"><span class="k">Next</span><span class="v">Nothing else today</span></div>';
    return nxt + '<button class="hm" type="button" data-act="go" data-sec="todos" data-id="tacme"><span class="k">Due Friday</span><span class="v">Acme contract</span></button>';
  }

  /* ------------------------------------------------------------------ */
  /* Render                                                              */
  /* ------------------------------------------------------------------ */
  const view = $('#view'), notes = $('#notes'), upd = $('#upd');
  const railNav = $('#railNav');
  function railCounts() {
    return { todos: openTodos().length, linear: openIssues().length, email: needsReply().length, calendar: leftToday(), github: openReviews().length };
  }
  function renderRail() {
    const c = railCounts();
    railNav.innerHTML = SECS.map((s, i) => {
      const n = c[s.k];
      return `<a class="ri${S.view === s.k ? ' on' : ''}" href="#${s.k}" data-act="go" data-sec="${s.k}" data-tip="${pad(i + 1)} · ${s.n}${n != null ? ' · ' + n : ''}" ${S.view === s.k ? 'aria-current="page"' : ''}><span class="ix">${pad(i + 1)}</span><span class="ct">${n != null && n > 0 ? pad(n) : ''}</span><svg viewBox="0 0 24 24">${s.svg}</svg><span class="cd">${s.cd}</span></a>`;
    }).join('');
  }
  let notesFrame = null;
  function render() {
    const k = keyOf(S.view), sec = SECS[k - 1];
    $('#hSec').textContent = `Sec ${pad(k)} / ${sec.n}`;
    $('#hTitle').textContent = S.view === 'dashboard' ? 'Dashboard' : S.view === 'notes' ? 'Daily Notes' : sec.n;
    $('#hMid').innerHTML = headMid();
    renderRail();
    renderTitanus();
    if (S.view === 'notes') {
      view.hidden = true; notes.hidden = false;
      if (!notesFrame) {
        notesFrame = document.createElement('iframe');
        notesFrame.title = 'Daily Note';
        notesFrame.addEventListener('load', () => notesFrame.contentWindow.postMessage({ type: 'proto-theme', theme: document.documentElement.dataset.theme }, '*'));
        notesFrame.src = `_reference-daily-note.html?signal=FF5F00&auto=1&theme=${document.documentElement.dataset.theme}`;
        notes.append(notesFrame);
      }
    } else {
      notes.hidden = true; view.hidden = false;
      const html = { dashboard: viewDashboard, linear: viewLinear, todos: viewTodos, email: viewEmail, calendar: viewCalendar, github: viewGitHub }[S.view]();
      view.className = 'view v-' + S.view;
      view.innerHTML = html;
    }
    if (S.flash) {
      const el = view.querySelector(`[data-item="${CSS.escape(S.flash)}"]`);
      if (el) { el.scrollIntoView({ block: 'nearest' }); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
      S.flash = null;
    }
  }
  function go(sec, id) {
    if (secIdx(sec) < 0) return;
    if (sec === 'linear' && id && issue(id)) { S.selIssue = id; if (S.linView === 'cycle' && !issue(id).cycle) S.linView = 'assigned'; }
    if (sec === 'calendar' && id && S.events.concat(S.tomorrow).some(e => e.id === id)) S.selEvent = id;
    S.view = sec; S.flash = id || null;
    render();
  }

  /* ------------------------------------------------------------------ */
  /* Actions (event delegation)                                          */
  /* ------------------------------------------------------------------ */
  function tick(id) {
    const t = S.todos.find(x => x.id === id); if (!t) return;
    if (t.origin === 'linear') {
      const is = issue(t.issue);
      if (is.state !== 'Done') { is.prev = is.state; is.state = 'Done'; }
      else is.state = is.prev && is.prev !== 'Done' ? is.prev : 'Todo';
      toast(`<b>${is.id}</b> moved to ${is.state} in Linear.`, () => { tick(id); });
    } else { t.done = !t.done; }
    render();
  }
  function accept(id) {
    const t = S.todos.find(x => x.id === id); if (!t || t.sug !== 'open') return;
    t.sug = 'accepted'; render();
    toast('Added to today’s Todos.', () => { t.sug = 'open'; render(); });
  }
  function dismiss(id) {
    const t = S.todos.find(x => x.id === id); if (!t || t.sug !== 'open') return;
    t.sug = 'dismissed'; render();
    toast('Dismissed. Titanus won’t raise it again today.', () => { t.sug = 'open'; render(); });
  }
  function setState(id, st) {
    const is = issue(id); if (!is || is.state === st) return;
    const was = is.state; is.prev = was; is.state = st; render();
    toast(`<b>${is.id}</b> moved to ${st} in Linear.`, () => { is.state = was; render(); });
  }
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const act = t.dataset.act, id = t.dataset.id;
    if (act === 'none') return;
    e.preventDefault(); e.stopPropagation();
    if (act === 'go') { if (!upd.hidden && t.closest('.upd')) closeUpdate(); go(t.dataset.sec, id); }
    else if (act === 'tick') tick(id);
    else if (act === 'accept') accept(id);
    else if (act === 'dismiss') dismiss(id);
    else if (act === 'ask') upd.hidden ? openUpdate() : closeUpdate();
    else if (act === 'sel') { S.selIssue = id; render(); }
    else if (act === 'selev') { S.selEvent = id; render(); }
    else if (act === 'state') setState(id, t.dataset.state);
    else if (act === 'linview') { S.linView = id; render(); }
    else if (act === 'reply') { const m = S.mail.find(x => x.id === id); m.replied = !m.replied; render(); if (m.replied) toast(`Marked <b>${esc(m.from)}</b> as replied.`, () => { m.replied = false; render(); }); }
    else if (act === 'review') { const r = S.reviews.find(x => x.id === id); r.done = !r.done; render(); }
  });

  /* ruler highlight for whatever module or sheet the pointer is over */
  const rulX = $('#rulX'), rulY = $('#rulY');
  for (let i = 1; i <= 24; i++) { const r = document.createElement('div'); r.className = 'r'; r.textContent = pad(i); rulY.insertBefore(r, $('#mY')); }
  const colCells = $$('.c', rulX), rowCells = $$('.r', rulY);
  let hovered = null;
  view.addEventListener('mouseover', e => {
    const m = e.target.closest('[data-c]');
    if (m === hovered) return; hovered = m;
    colCells.forEach(c => c.classList.remove('hv')); rowCells.forEach(c => c.classList.remove('hv'));
    if (!m) return;
    const [c0, c1] = m.dataset.c.split('-').map(Number), [r0, r1] = m.dataset.r.split('-').map(Number);
    for (let i = c0; i <= c1; i++) colCells[i - 1].classList.add('hv');
    for (let j = r0; j <= r1; j++) rowCells[j - 1].classList.add('hv');
  });
  view.addEventListener('mouseleave', () => { hovered = null; colCells.forEach(c => c.classList.remove('hv')); rowCells.forEach(c => c.classList.remove('hv')); });

  /* ------------------------------------------------------------------ */
  /* Toast                                                               */
  /* ------------------------------------------------------------------ */
  let toastTimer = 0;
  const toastEl = $('#toast');
  function toast(msg, undo) {
    toastEl.innerHTML = `<span>${msg}</span>` + (undo ? '<button type="button">Undo</button>' : '');
    if (undo) toastEl.querySelector('button').onclick = ev => { ev.stopPropagation(); undo(); hideToast(); };
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, undo ? 5200 : 3200);
  }
  function hideToast() { toastEl.classList.remove('show'); }

  /* ------------------------------------------------------------------ */
  /* Theme (URL ?theme=, parent switcher, own toggle; forwarded to Notes) */
  /* ------------------------------------------------------------------ */
  const thmLbl = $('#thmLbl');
  function applyTheme(t, announce) {
    t = t === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    thmLbl.textContent = t === 'dark' ? 'Drk' : 'Lgt';
    $('#thmBtn').setAttribute('data-tip', t === 'dark' ? 'Switch to light' : 'Switch to dark');
    if (notesFrame && notesFrame.contentWindow) notesFrame.contentWindow.postMessage({ type: 'proto-theme', theme: t }, '*');
    if (announce) { try { parent.postMessage({ type: 'proto-theme-changed', theme: t }, '*'); } catch (e) {} }
  }
  applyTheme(new URLSearchParams(location.search).get('theme'));
  addEventListener('message', e => {
    const d = e.data || {};
    if (d.type === 'proto-theme' && (d.theme === 'dark' || d.theme === 'light')) applyTheme(d.theme);
    // the embedded Daily Note forwards ← → to us; pass them on to the switcher
    if (d.type === 'proto-key' && notesFrame && e.source === notesFrame.contentWindow && parent !== window) parent.postMessage(d, '*');
  });
  $('#thmBtn').addEventListener('click', () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true));

  /* ------------------------------------------------------------------ */
  /* Titanus: presence, queue, update (never opens on his own)           */
  /* ------------------------------------------------------------------ */
  const ttn = $('#ttn'), tCount = $('#tCount'), tLine = $('#tLine'), tPres = $('#tPres'), askBtn = $('#askBtn');
  const updList = $('#updList');
  const AWAY_MS = 45000;
  let lastInput = Date.now(), away = false, awaySince = null, askedAt = null;
  function openCount() { return QUEUE.filter(q => q.state === 'open').length; }
  const things = n => `${n} thing${n === 1 ? '' : 's'}`;
  function renderTitanus() {
    const n = openCount();
    tCount.textContent = pad(n);
    ttn.classList.toggle('empty', n === 0);
    ttn.classList.toggle('away', away);
    tPres.innerHTML = away ? `<i class="led"></i>Away · since ${hhmm(awaySince)}` : '<i class="led"></i>You’re here';
    tLine.textContent = !n ? 'Titanus has nothing for you right now' : away ? `Titanus is holding ${things(n)} for you` : `Titanus has ${things(n)} for you`;
    if (!upd.hidden) renderUpdate();
  }
  const SAY = [
    'That’s everything. I’ll hold anything new until you ask.',
    'One thing left.',
    'Two things left. Both are quick.',
    'Three things left. None of them take long.',
    'Four things. None of them take long.',
  ];
  function itemHTML(q, i) {
    if (q.state !== 'open') {
      return `<li class="qi cleared" data-q="${q.id}"><div class="qn">${pad(i + 1)}</div><div class="qb"><div class="qt">${esc(q.title)}</div>
        <div class="qa"><span class="qs">${q.state === 'done' ? 'Done' : 'Dismissed'} · ${q.at}</span><button class="q-undo" type="button">Undo</button></div></div></li>`;
    }
    return `<li class="qi" data-q="${q.id}"><div class="qn">${pad(i + 1)}</div><div class="qb">
      <div class="qt">${esc(q.title)}</div><div class="qd">${esc(q.body)}</div>
      <div class="qa"><button class="q-done" type="button">Done</button><button class="q-dis" type="button">Dismiss</button><button class="q-ref" type="button" title="Open it in its Section">↳ ${esc(q.refLabel)}</button></div>
      </div></li>`;
  }
  function renderUpdate() {
    const n = openCount();
    $('#updSay').textContent = SAY[n];
    $('#updMeta').innerHTML = `<span>Asked <b>${askedAt}</b></span><span>Queued <b>${pad(n)}</b></span><span>Cleared <b>${pad(QUEUE.length - n)}</b></span>`;
    updList.innerHTML = QUEUE.map(itemHTML).join('');
  }
  function syncAsk() {
    askBtn.setAttribute('aria-expanded', String(!upd.hidden));
    $$('.tq-ask').forEach(b => b.setAttribute('aria-expanded', String(!upd.hidden)));
  }
  function openUpdate() {
    askedAt = hhmm(now());
    upd.hidden = false;
    upd.classList.remove('in'); void upd.offsetWidth; upd.classList.add('in');
    renderUpdate(); syncAsk();
  }
  function closeUpdate() { upd.hidden = true; syncAsk(); }
  askBtn.addEventListener('click', e => { e.stopPropagation(); upd.hidden ? openUpdate() : closeUpdate(); });
  $('#updClose').addEventListener('click', closeUpdate);
  updList.addEventListener('click', e => {
    const li = e.target.closest('.qi'); if (!li) return;
    const q = QUEUE.find(x => x.id === li.dataset.q);
    const before = openCount();
    if (e.target.closest('.q-done')) { q.state = 'done'; q.at = hhmm(now()); }
    else if (e.target.closest('.q-dis')) { q.state = 'dismissed'; q.at = hhmm(now()); }
    else if (e.target.closest('.q-undo')) { q.state = 'open'; q.at = ''; }
    else if (e.target.closest('.q-ref')) { closeUpdate(); go(q.sec, q.ref); return; }
    if (openCount() !== before) render();
  });

  /* keys: 1–7 Sections, U update, Esc close, ↑↓ in Linear */
  document.addEventListener('keydown', e => {
    const typing = e.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (typing || e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
    if (/^[1-7]$/.test(e.key)) { e.preventDefault(); go(SECS[+e.key - 1].k); return; }
    if (e.key === 'u' || e.key === 'U') { e.preventDefault(); upd.hidden ? openUpdate() : closeUpdate(); return; }
    if (e.key === 'Escape' && !upd.hidden) { e.preventDefault(); closeUpdate(); return; }
    if (S.view === 'linear' && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'j' || e.key === 'k')) {
      e.preventDefault();
      const order = ORDER.flatMap(st => linList().filter(i => i.state === st)).map(i => i.id);
      const ix = order.indexOf(S.selIssue), d = (e.key === 'ArrowDown' || e.key === 'j') ? 1 : -1;
      S.selIssue = order[Math.max(0, Math.min(order.length - 1, ix + d))];
      render();
      const sel = view.querySelector('.srow.sel'); if (sel) sel.scrollIntoView({ block: 'nearest' });
    }
  });
  function poke() { lastInput = Date.now(); if (away) { away = false; renderTitanus(); } }
  ['pointermove', 'pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(t => addEventListener(t, poke, { passive: true, capture: true }));

  /* ------------------------------------------------------------------ */
  /* Live: clock, countdowns, now-lines                                  */
  /* ------------------------------------------------------------------ */
  let lastMin = -1;
  function everySecond() {
    const d = now();
    $('#clock').textContent = hhmm(d) + ':' + pad(d.getSeconds());
    if (!away && Date.now() - lastInput >= AWAY_MS) { away = true; awaySince = new Date(BASE + (lastInput - T0)); renderTitanus(); }
    const m = d.getHours() * 60 + d.getMinutes();
    if (m !== lastMin) {
      lastMin = m;
      const nm = nowMin();
      $$('[data-countdown]').forEach(el => { const ev = S.events.find(x => x.id === el.dataset.countdown); if (ev) el.textContent = el.textContent.replace(/in .*$/, 'in ' + dur(mins(ev.s) - nm)); });
      const X = ((Math.min(Math.max(nm, 480), 1200) - 480) / 720 * 100).toFixed(3) + '%';
      const cn = $('#calNow'); if (cn) { cn.style.left = X; $('#calPast').style.width = X; $('#calNowT').textContent = hhmm(d); }
    }
  }
  setInterval(everySecond, 1000);

  /* ------------------------------------------------------------------ */
  /* Exposed grid + pointer markers                                      */
  /* ------------------------------------------------------------------ */
  const gridWrap = $('#gridwrap'), gridSvg = $('#gridbg');
  function drawGrid() {
    const w = gridWrap.clientWidth, h = gridWrap.clientHeight; if (!w || !h) return;
    gridSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const cw = w / 8, rh = h / 24; let c = '', r = '', x = '';
    for (let i = 1; i < 8; i++) { const X = Math.round(i * cw) + .5; c += `M${X} 0V${h}`; }
    for (let j = 1; j < 24; j++) { const Y = Math.round(j * rh) + .5; r += `M0 ${Y}H${w}`; }
    for (let i = 0; i <= 8; i++) for (let j = 0; j <= 24; j++) {
      const X = Math.round(i * cw) + .5, Y = Math.round(j * rh) + .5;
      x += `M${X - 4} ${Y}H${X + 4}M${X} ${Y - 4}V${Y + 4}`;
    }
    gridSvg.innerHTML = `<path class="gr" d="${r}"/><path class="gc" d="${c}"/><path class="gx" d="${x}"/>`;
  }
  const mX = $('#mX'), mY = $('#mY');
  let mouse = null, mRaf = 0;
  addEventListener('pointermove', e => { mouse = { x: e.clientX, y: e.clientY }; if (!mRaf) mRaf = requestAnimationFrame(placeMouse); }, { passive: true });
  document.documentElement.addEventListener('pointerleave', () => { mouse = null; placeMouse(); });
  function placeMouse() {
    mRaf = 0;
    const g = gridWrap.getBoundingClientRect();
    const inX = mouse && mouse.x >= g.left && mouse.x <= g.right, inY = mouse && mouse.y >= g.top && mouse.y <= g.bottom;
    mX.style.display = inX ? 'block' : 'none'; mY.style.display = inY ? 'block' : 'none';
    if (inX) mX.style.transform = `translateX(${mouse.x - rulX.getBoundingClientRect().left}px)`;
    if (inY) mY.style.transform = `translateY(${mouse.y - g.top}px)`;
  }
  let rT = 0;
  addEventListener('resize', () => { drawGrid(); clearTimeout(rT); rT = setTimeout(() => { if (S.view === 'calendar') render(); }, 120); });

  /* ------------------------------------------------------------------ */
  const q = new URLSearchParams(location.search);
  const start = (q.get('section') || '').toLowerCase();
  if (secIdx(start) >= 0) S.view = start;
  else if (secIdx(location.hash.slice(1)) >= 0) S.view = location.hash.slice(1);
  render(); drawGrid(); everySecond();
  if (q.get('update') === '1') openUpdate();
})();
</script>
<script>document.addEventListener('keydown',e=>{if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&!(e.target.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)))parent.postMessage({type:'proto-key',key:e.key},'*')});</script>
</body>
